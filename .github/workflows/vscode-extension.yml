name: VS Code extension package
on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - 'examples/caller-source-fill/source.gooo'
      - '.github/workflows/vscode-extension-release.yml'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'editors/vscode/**'
      - 'examples/caller-source-fill/source.gooo'
      - '.github/workflows/vscode-extension-release.yml'
      - '.github/workflows/vscode-extension.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Validate extension manifests and package
        working-directory: editors/vscode
        run: |
          node -e 'for (const file of ["package.json", "language-configuration.json", "syntaxes/gooo.tmLanguage.json", "snippets/gooo.json"]) JSON.parse(require("node:fs").readFileSync(file, "utf8"))'
          node -e 'const m=require("./package.json"); const s=require("node:fs").readFileSync("extension.js","utf8"); for(const c of m.contributes.commands) if(!s.includes(c.command)) throw Error(`unregistered command: ${c.command}`); if(m.contributes.grammars[0].scopeName!=="source.gooo") throw Error("unexpected grammar scope")'
          node -c extension.js
          npm ci
          mkdir -p .test-compiler/bin
          curl --fail --location --show-error https://github.com/kimjooyoon/meta-ontology-go/releases/download/v0.6.23-dev/gooo-linux-amd64.tar.gz --output .test-compiler/gooo-linux-amd64.tar.gz
          printf '%s  %s\n' 603619c0938cb2b73db2b1420cf74dc1a8d856c311267b781e9687f23e57bae9 .test-compiler/gooo-linux-amd64.tar.gz | sha256sum -c -
          tar -xzf .test-compiler/gooo-linux-amd64.tar.gz -C .test-compiler/bin
          .test-compiler/bin/gooo version --build --json > .test-compiler/compiler-build.json
          node -e 'const b=require("./.test-compiler/compiler-build.json"); if(b.version!=="0.6.23-dev" || b.vcs_revision!=="2b17c4879d0bb2cd1e48ccc23b8743c0fb564267" || b.vcs_modified!=="false" || b.go_version!=="go1.27.2" || b.decision_runtime.version!=="v0.2.26-experimental") throw Error("unexpected public compiler identity")'
          curl --fail --location --show-error https://github.com/kimjooyoon/gooo-ecosystem-workbench/releases/download/vscode-v0.2.3/gooo-language-support-0.2.3.vsix --output .test-compiler/baseline-0.2.3.vsix
          printf '%s  %s\n' 5f439f13e1e669c0ebfbf80f25975af6c54455958e2ea8886888e971181a19d6 .test-compiler/baseline-0.2.3.vsix | sha256sum -c -
          unset GOOO_LAYA_URL GOOO_LAYA_API_KEY
          GOTOOLCHAIN=local \
            GOOO_TEST_LIBRARY_REQUIRED=1 \
            GOOO_TEST_LIBRARY_EXECUTABLE="$PWD/.test-compiler/bin/gooo" \
            GOOO_TEST_LIBRARY_EXECUTABLE_SHA256="$(sha256sum .test-compiler/bin/gooo | cut -d ' ' -f 1)" \
            GOOO_TEST_LIBRARY_GO_EXECUTABLE="$(command -v go)" \
            GOOO_TEST_LIBRARY_GO_SHA256="$(sha256sum "$(command -v go)" | cut -d ' ' -f 1)" \
            GOOO_TEST_LIBRARY_BASELINE_VSIX="$PWD/.test-compiler/baseline-0.2.3.vsix" \
            GOOO_TEST_LSP_REQUIRED=1 \
            GOOO_TEST_LSP_EXECUTABLE="$PWD/.test-compiler/bin/gooo" \
            GOOO_TEST_LSP_EXECUTABLE_SHA256="$(sha256sum .test-compiler/bin/gooo | cut -d ' ' -f 1)" \
            node --test test/*.test.js
          npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: gooo-language-support-vsix
          path: editors/vscode/gooo-language-support-*.vsix
