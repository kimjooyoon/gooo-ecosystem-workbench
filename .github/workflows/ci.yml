name: Gooo ecosystem examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          repository: kimjooyoon/meta-ontology-go
          ref: 8951c5f8f22526e9cc1225a4dd47e63a6d420c4a
          path: .compiler
      - name: Build the pinned Gooo compiler
        working-directory: .compiler
        run: go build -trimpath -o ../.gooo ./cmd/gooo
      - name: Observe the pinned compiler identity
        run: |
          mkdir -p out
          ./.gooo version --build --json > out/compiler-build.json
          jq -e '.version == "0.6.18-dev" and .go_version == "go1.27.2" and .vcs_revision == "8951c5f8f22526e9cc1225a4dd47e63a6d420c4a" and .vcs_modified == "false" and .decision_runtime.version == "v0.2.26-experimental"' out/compiler-build.json
      - name: Check Go transport code and execute Gooo programs
        env:
          GOOO_COMPILER: ${{ github.workspace }}/.gooo
          GOWORK: 'off'
        run: |
          test -z "$(gofmt -l assets.go workbench.go workbench_test.go compiler_diagnostic.go compiler_diagnostic_test.go snapshot.go workspace_snapshot_test.go construction_next.go construction_next_test.go construction_search.go construction_search_test.go source_budget_test.go refine.go refine_execution.go refine_test.go search_refine_test.go search_policy_test.go calibrated_report_test.go experiments/construction-loop/main.go experiments/source-budget/main.go experiments/search-refinement/main.go experiments/search-policy/main.go experiments/calibrated-report/main.go cmd/workbench/main.go cmd/workbench/refine.go)"
          test -z "$(gofmt -l retry_policy_test.go)"
          test -z "$(gofmt -l api_*.go)"
          test -z "$(gofmt -l feature_audit.go feature_audit_test.go feature_audit_projection.go feature_audit_origin_test.go feature_audit_graph_test.go feature_audit_graph_model_test.go experiments/graph-feature-fixture/main.go)"
          test -z "$(gofmt -l feature_audit_corpus_test.go feature_audit_intent_test.go experiments/graph-choice-corpus/*.go)"
          test -z "$(gofmt -l experiments/graph-chooser/*.go)"
          test -z "$(gofmt -l joint_snapshot.go joint_snapshot_test.go joint_next.go joint_next_test.go joint_loop.go joint_loop_test.go joint_feedback.go joint_feedback_test.go)"
          test -z "$(gofmt -l package_joint.go package_joint_loop.go package_joint_test.go package_observed_test.go experiments/package-construction-observe/main.go)"
          test -z "$(gofmt -l experiments/joint-feedback-observe/main.go)"
          test -z "$(gofmt -l joint_search_snapshot.go joint_search_snapshot_test.go)"
          test -z "$(gofmt -l joint_rejection_snapshot.go joint_rejection_snapshot_test.go)"
          test -z "$(gofmt -l joint_fill_snapshot.go joint_fill_snapshot_test.go construction_fill.go)"
          test -z "$(gofmt -l experiments/source-fill-observe/main.go)"
          test -z "$(gofmt -l joint_fill_rejection_test.go experiments/fill-rejection-observe/main.go)"
          test -z "$(gofmt -l native_outcome.go native_outcome_test.go native_next.go experiments/native-outcome-observe/main.go)"
          test -z "$(gofmt -l splice.go splice_execution.go splice_test.go experiments/dependent-splice/*.go)"
          go vet ./...
          go test -race ./...
          go run ./experiments/source-fill-observe > out/source-fill-recount.json
          cmp publication/caller-source-fill-20261009/summary.json out/source-fill-recount.json
          go run ./experiments/fill-rejection-observe > out/fill-rejection-recount.json
          cmp publication/caller-fill-rejection-20261009/summary.json out/fill-rejection-recount.json
          go run ./experiments/native-outcome-observe > out/native-outcome-recount.json
          cmp publication/native-outcomes-20261009/summary.json out/native-outcome-recount.json
          go run ./experiments/package-construction-observe > out/package-construction-recount.json
          cmp publication/package-construction-20261009/summary.json out/package-construction-recount.json
      - name: Classify declaration changes with the Gooo policy
        run: |
          go run ./cmd/workbench api-diff --compiler "$PWD/.gooo" \
            --before examples/api-evolution/before/gooo.workspace.json \
            --after examples/api-evolution/after/gooo.workspace.json --out out/ci-api-diff
          jq -e '.decision == "OBSERVED" and .change_count == 3 and .classified_changes == 3 and .observation.named_total == 0 and .observation.generation_model_calls == 0 and .observation.saved_replay_verified and ([.changes[].assessment.code] == ["input-tightened", "output-weakened", "field-added"])' out/ci-api-diff/api-diff.json
      - name: Let Gooo continue package construction from caller failures
        run: |
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --workspace examples/package-caller-construction/gooo.workspace.json \
            --construction-cases examples/package-caller-construction/initial-cases.json \
            --evaluation-cases examples/package-caller-construction/evaluation-cases.json \
            --holdout-cases examples/package-caller-construction/holdout-cases.json \
            --max-program-budget 8 --max-rounds 5 --out out/ci-package-loop
          jq -e '.schema == "gooo/package-construction-loop/v1" and (.rounds|length) == 5 and ([.rounds[].program_attempts]|add) == 14 and .rounds[0].feedback.consumed_by_next_round and .final_evaluation.passed == 4 and .final_evaluation.total == 4 and .final_evaluation.package_construction.entry.package_path == "app/retry" and .final_evaluation.joint_construction.new_model_calls == 0' out/ci-package-loop/joint-loop.json
          ./.gooo package construct --json \
            --construction-cases examples/package-caller-construction/mixed-construction-cases.json \
            --cases examples/package-caller-construction/mixed-evaluation-cases.json \
            --attempts 48 --model models/graph-chooser-20261008/all-data-demonstration/qat_ternary/model.json \
            examples/package-caller-construction/mixed.workspace.json > out/ci-package-model.json
          jq -e '.decision == "COMPLETE_FINITE" and (.result.construction.attempts|length) == 41 and .result.evaluation.runtime.finite_passed == 4 and .result.evaluation.runtime.finite_total == 4 and .result.evaluation.new_model_calls == 0' out/ci-package-model.json
      - name: Continue after native arithmetic faults using Gooo feedback
        run: |
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --source examples/caller-native-failure/source.gooo --entry Main \
            --construction-cases examples/caller-native-failure/initial-cases.json \
            --evaluation-cases examples/caller-native-failure/evaluation-cases.json \
            --holdout-cases examples/caller-native-failure/holdout-cases.json \
            --max-program-budget 8 --max-rounds 5 --out out/ci-native-fault
          jq -e '.stop_reason == "add-different-evaluation-inputs" and (.rounds|length) == 5 and ([.rounds[].program_attempts]|add) == 14 and .rounds[0].feedback.consumed_by_next_round and .final_evaluation.passed == 4 and .final_evaluation.total == 4 and .final_evaluation.joint_construction.native_fault_attempts == 1 and .final_evaluation.joint_construction.rejected_attempts == 2 and .final_evaluation.joint_construction.new_model_calls == 0' out/ci-native-fault/joint-loop.json
          ./.gooo body-construct --source .compiler/examples/caller-native-failure/mixed-model.gooo.fixture --entry Main \
            --construction-cases .compiler/examples/caller-native-failure/mixed-construction-cases.json \
            --cases .compiler/examples/caller-native-failure/mixed-evaluation-cases.json --attempts 48 \
            --model models/graph-chooser-20261008/all-data-demonstration/qat_ternary/model.json \
            --out out/ci-native-model > out/ci-native-model.json
          jq -e '.construction.schema == "gooo/joint-construction/v6" and (.construction.attempts|length) == 6 and .evaluation.runtime.finite_passed == 4 and .evaluation.runtime.finite_total == 4 and .evaluation.new_model_calls == 0' out/ci-native-model.json
      - name: Continue after rejected fill assignments with Gooo feedback
        run: |
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --source examples/caller-fill-rejection/source.gooo --entry Main \
            --construction-cases examples/caller-fill-rejection/initial-cases.json \
            --evaluation-cases examples/caller-fill-rejection/evaluation-cases.json \
            --holdout-cases examples/caller-fill-rejection/holdout-cases.json \
            --max-program-budget 8 --max-rounds 5 --out out/ci-fill-rejection
          jq -e '(.rounds|length)==5 and ([.rounds[].program_attempts]|add)==13 and .final_evaluation.passed==4 and .final_evaluation.total==4 and .final_evaluation.joint_construction.rejected_attempts==2 and .final_evaluation.joint_construction.new_model_calls==0' out/ci-fill-rejection/joint-loop.json
      - name: Use Gooo feedback to construct complete source-fill assignments
        run: |
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --source examples/caller-source-fill/source.gooo --entry Main \
            --construction-cases examples/caller-source-fill/initial-cases.json \
            --evaluation-cases examples/caller-source-fill/evaluation-cases.json \
            --holdout-cases examples/caller-source-fill/holdout-cases.json \
            --max-program-budget 4 --max-rounds 4 --out out/ci-source-fill
          jq -e '.stop_reason == "add-different-evaluation-inputs" and (.rounds|length) == 4 and ([.rounds[].program_attempts]|add) == 7 and .rounds[0].feedback.consumed_by_next_round and .final_evaluation.passed == 4 and .final_evaluation.total == 4 and .final_evaluation.joint_construction.fill_holdout_passed == 1 and .final_evaluation.joint_construction.fill_holdout_total == 1 and .final_evaluation.joint_construction.new_model_calls == 0' out/ci-source-fill/joint-loop.json
          ./.gooo body-construct --source .compiler/examples/caller-source-fill/mixed-model.gooo.fixture --entry Main \
            --construction-cases .compiler/examples/caller-source-fill/mixed-construction-cases.json \
            --cases .compiler/examples/caller-source-fill/mixed-evaluation-cases.json --attempts 24 \
            --model models/graph-chooser-20261008/all-data-demonstration/qat_ternary/model.json \
            --out out/ci-source-fill-model > out/ci-source-fill-model.json
          jq -e '.construction.schema == "gooo/joint-construction/v4" and (.construction.attempts|length) == 3 and .evaluation.runtime.finite_passed == 4 and .evaluation.runtime.finite_total == 4 and .evaluation.new_model_calls == 0' out/ci-source-fill-model.json
      - name: Continue past rejected expressions using Gooo feedback and the own model
        run: |
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --source .compiler/examples/caller-search-rejection/mixed-model.gooo.fixture --entry Main \
            --construction-cases examples/joint-feedback/initial-cases.json \
            --evaluation-cases .compiler/examples/caller-search-rejection/mixed-construction-cases.json \
            --holdout-cases .compiler/examples/caller-search-rejection/mixed-evaluation-cases.json \
            --model models/graph-chooser-20261008/all-data-demonstration/qat_ternary/model.json \
            --max-program-budget 40 --max-rounds 8 --out out/ci-joint-rejection
          jq -e '.stop_reason == "add-different-evaluation-inputs" and (.rounds|length) == 7 and ([.rounds[].program_attempts]|add) == 49 and .final_evaluation.passed == 4 and .final_evaluation.total == 4 and .final_evaluation.joint_construction.rejected_attempts == 8 and .final_evaluation.joint_construction.native_program_attempts == 9 and .final_evaluation.joint_construction.new_model_calls == 0' out/ci-joint-rejection/joint-loop.json
      - name: Let Gooo drive whole-program construction budgets
        run: |
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --source examples/joint-diagnostics/source.gooo --entry Main \
            --construction-cases examples/joint-diagnostics/construction-cases.json \
            --evaluation-cases examples/joint-diagnostics/evaluation-cases.json \
            --max-program-budget 8 --max-rounds 4 --out out/ci-joint-fixed
          go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
            --source examples/joint-diagnostics/source.gooo --entry Main \
            --construction-cases examples/joint-diagnostics/construction-cases.json \
            --evaluation-cases examples/joint-diagnostics/evaluation-cases.json \
            --model models/graph-chooser-20261008/all-data-demonstration/qat_ternary/model.json \
            --max-program-budget 8 --max-rounds 4 --out out/ci-joint-model
          jq -e '.stop_reason == "observe-new-inputs" and (.rounds|length) == 4 and ([.rounds[].program_attempts]|add) == 15 and .rounds[-1].evaluation_passed == 7' out/ci-joint-fixed/joint-loop.json
          jq -e '.stop_reason == "observe-new-inputs" and (.rounds|length) == 1 and .rounds[0].program_attempts == 1 and .rounds[0].evaluation_passed == 7' out/ci-joint-model/joint-loop.json
      - name: Feed unchanged counterexamples back and evaluate final holdout
        run: |
          for family in arithmetic charge; do
            source=examples/joint-diagnostics/source.gooo
            prefix=examples/joint-feedback/
            if [ "$family" = charge ]; then
              source=examples/joint-feedback/charge.gooo
              prefix=examples/joint-feedback/charge-
            fi
            for mode in fixed model; do
              model_args=()
              if [ "$mode" = model ]; then
                model_args=(--model models/graph-chooser-20261008/all-data-demonstration/qat_ternary/model.json)
              fi
              go run ./cmd/workbench construct --compiler "$PWD/.gooo" \
                --source "$source" --entry Main \
                --construction-cases examples/joint-feedback/initial-cases.json \
                --evaluation-cases "${prefix}adaptive-cases.json" \
                --holdout-cases "${prefix}holdout-cases.json" \
                --max-program-budget 8 --max-rounds 6 "${model_args[@]}" \
                --out "out/ci-feedback-$family-$mode"
              jq -e '.schema == "gooo/joint-construction-loop/v2" and .final_evaluation.passed == 4 and .final_evaluation.total == 4 and .final_evaluation.joint_construction.construction_replayed == true and .final_evaluation.joint_construction.new_model_calls == 0' "out/ci-feedback-$family-$mode/joint-loop.json"
            done
          done
      - name: Verify typed IR body fill through the editor result contract
        run: |
          mkdir -p out
          ./.gooo body-codegen --json --activity Lift .compiler/examples/body-codegen/source-ir-fill-derived.gooo.fixture > out/editor-body-generation.json
          node -e 'const fs=require("node:fs"); const {parseBodyCodegenResult}=require("./editors/vscode/body-generation"); const source=fs.readFileSync(".compiler/examples/body-codegen/source-ir-fill-derived.gooo.fixture","utf8"); const result=parseBodyCodegenResult(fs.readFileSync("out/editor-body-generation.json","utf8"),source); const fill=result.report.body_fill; if(!result.gooo_source || result.gooo_source.includes("__GOOO_BODY_HOLE_") || !fill || fill.functional_accuracy_percent !== 100 || fill.hole_fills.length !== 2) throw Error("compiler did not return a complete, measured typed IR body fill"); console.log(JSON.stringify({activity:result.report.activity,candidate:fill.selected_candidate_id,training:fill.functional_accuracy_percent,holes:fill.hole_fills.length,decision_ms:fill.timing.provider_decision_ms}))'
      - name: Retain source-bound functional observations
        run: go run ./cmd/workbench verify --compiler "$PWD/.gooo" --model builtin --out out/ci-verification
      - name: Build a Gooo completeness receipt from verified evidence
        run: go run ./cmd/workbench receipt --compiler "$PWD/.gooo" --input out/ci-verification --out out/ci-completeness
      - name: Let Gooo dispatch source refinement with the own compact model
        run: |
          go run ./cmd/workbench refine --compiler "$PWD/.gooo" \
            --source examples/source-refinement/source.gooo --activity Select \
            --cases examples/source-refinement/feedback-cases.json \
            --evaluation-cases examples/source-refinement/evaluation-cases.json \
            --policy examples/source-refinement/policy.gooo --model builtin \
            --max-attempts 8 --max-rounds 4 --out out/ci-refinement
      - name: Observe source search, mixed model construction and grammar limits
        run: go run ./experiments/search-refinement --compiler "$PWD/.gooo" --out out/ci-search-refinement
      - name: Execute source-declared grammar transitions and bounded controls
        run: go run ./experiments/search-policy --compiler "$PWD/.gooo" --out out/ci-search-policy
      - name: Compose quadratic calibration with compact-model report fields
        run: go run ./experiments/calibrated-report --compiler "$PWD/.gooo" --out out/ci-calibrated-report
      - name: Construct and reuse the Gooo retry policy
        run: |
          mkdir -p out/ci-retry-policy
          ./.gooo body-compose --source examples/retry-policy/source.gooo --cases examples/retry-policy/cases.json --out out/ci-retry-policy/fixed > out/ci-retry-policy/fixed.json
          ./.gooo body-compose --source examples/retry-policy/source.gooo --cases examples/retry-policy/cases.json --model models/shared-qat/model.json --out out/ci-retry-policy/model > out/ci-retry-policy/model.json
          ./.gooo body-compose --source out/ci-retry-policy/model/original.gooo --composition out/ci-retry-policy/model/composition.json --cases examples/retry-policy/cases.json > out/ci-retry-policy/replay.json
          for result in fixed model replay; do
            jq -e '.runtime.finite_passed == 12 and .runtime.finite_total == 12 and .runtime.model_calls == 0' "out/ci-retry-policy/$result.json"
          done
          jq -e '.generated_now == false' out/ci-retry-policy/replay.json
      - name: Generate a public interface reference in Gooo
        run: go run ./cmd/workbench reference --compiler "$PWD/.gooo" --package examples/catalog --entry ApproveInvoice --out out/ci-reference
      - name: Let Gooo assess candidate-feature collisions
        run: |
          go run ./cmd/workbench feature-audit --compiler "$PWD/.gooo" \
            --input examples/feature-audit/filename-order.json --model builtin --out out/ci-feature-audit
          jq -e '.rows == 8 and .families == 1 and .distinct_feature_vectors == 2 and .maximum_compatible_rows == 2 and .model_satisfied_rows == 1 and .policy.code == "representation-collision"' out/ci-feature-audit/feature-audit.json
          go run ./cmd/workbench feature-audit --compiler "$PWD/.gooo" \
            --input examples/feature-audit/filename-origin-order.json --out out/ci-origin-feature-audit
          jq -e '.rows == 8 and .families == 1 and .distinct_feature_vectors == 4 and .maximum_compatible_rows == 4 and .model_observed == false and .model_calls == 0 and .policy_runtime_replayed == true and .policy.code == "representation-collision"' out/ci-origin-feature-audit/feature-audit.json
          go run ./cmd/workbench feature-audit --compiler "$PWD/.gooo" \
            --input examples/feature-audit/filename-graph-order.json --out out/ci-graph-feature-audit
          jq -e '.rows == 8 and .families == 1 and .distinct_feature_vectors == 8 and .maximum_compatible_rows == 8 and .model_observed == false and .model_calls == 0 and .policy_runtime_replayed == true and .policy.code == "input-consistent" and .policy.action == "evaluate-chooser"' out/ci-graph-feature-audit/feature-audit.json
          go run ./cmd/workbench feature-audit --compiler "$PWD/.gooo" \
            --input examples/feature-audit/three-family-graph.json --out out/ci-graph-corpus-audit
          jq -e '.rows == 72 and .families == 3 and .distinct_feature_vectors == 72 and .maximum_compatible_rows == 72 and .model_calls == 0 and .model_observed == false and .policy_runtime_replayed == true and .policy.action == "evaluate-chooser"' out/ci-graph-corpus-audit/feature-audit.json
      - name: Compare intent contrasts with identical code graphs
        run: |
          gzip -dc examples/feature-audit/three-family-intent-contrasts.json.gz > out/intent-full.json
          gzip -dc examples/feature-audit/three-family-intent-ablated.json.gz > out/intent-ablated.json
          for mode in full ablated; do
            go run ./cmd/workbench feature-audit --compiler "$PWD/.gooo" \
              --input "out/intent-$mode.json" --out "out/ci-intent-$mode"
            jq -e '.rows == 576 and .families == 3 and .model_calls == 0 and .model_observed == false and .policy_runtime_replayed == true' "out/ci-intent-$mode/feature-audit.json"
          done
          jq -e '.distinct_feature_vectors == 576 and .maximum_compatible_rows == 576 and .policy.action == "evaluate-chooser"' out/ci-intent-full/feature-audit.json
          jq -e '.distinct_feature_vectors == 24 and .maximum_compatible_rows == 72 and .policy.code == "representation-collision"' out/ci-intent-ablated/feature-audit.json
      - name: Reproduce the frozen source graph training study
        run: |
          go run ./experiments/graph-chooser --out out/ci-graph-training
          for fold in filenames division retry all-data-demonstration; do
            for variant in fp32 ptq_ternary qat_ternary; do
              for file in model.json weights.bin; do
                cmp "models/graph-chooser-20261008/$fold/$variant/$file" "out/ci-graph-training/$fold/$variant/$file"
              done
            done
          done
          go run ./cmd/workbench feature-audit --compiler "$PWD/.gooo" \
            --input out/intent-full.json \
            --model out/ci-graph-training/all-data-demonstration/qat_ternary/model.json \
            --out out/ci-trained-graph-audit
          jq -e '.rows == 576 and .model_calls == 576 and .model_satisfied_rows == 297 and .maximum_compatible_rows == 576 and .policy_runtime_replayed == true' out/ci-trained-graph-audit/feature-audit.json
      - name: Evaluate dependent source edits with the unchanged graph model
        run: |
          go run ./experiments/dependent-splice --compiler "$PWD/.gooo" --out out/ci-dependent-splice
          jq -e '.program_families == 1 and .unique_native_inputs == 542 and .selection_overlap == 0 and (.runs | length) == 8 and ([.runs[] | select(.budget == 8) | .native.passed == 542 and .replay.passed == 542] | all)' out/ci-dependent-splice/summary.json
      - name: Run Korean and English capability discovery through Gooo
        env:
          GOOO_COMPILER: ${{ github.workspace }}/.gooo
          GOWORK: 'off'
        run: |
          go run ./cmd/workbench discover --compiler "$PWD/.gooo" --query '코드 생성은 어떻게 해?' --declaration examples/catalog/operations.gooo --out out/ci-discover-korean
          go run ./cmd/workbench discover --compiler "$PWD/.gooo" --query 'Can gooo execute this?' --declaration examples/catalog/operations.gooo --out out/ci-discover-deferred
          go run ./cmd/workbench discover --compiler "$PWD/.gooo" --query 'quantum breakfast compiler' --out out/ci-discover-unknown
      - uses: actions/upload-artifact@v7
        with:
          name: gooo-ecosystem-observations
          path: |
            out/compiler-build.json
            out/ci-api-diff/
            out/ci-package-loop/
            out/ci-package-model.json
            out/package-construction-recount.json
            out/ci-native-fault/
            out/ci-native-model/
            out/ci-native-model.json
            out/native-outcome-recount.json
            out/ci-fill-rejection/
            out/fill-rejection-recount.json
            out/ci-source-fill/
            out/ci-source-fill-model/
            out/ci-source-fill-model.json
            out/ci-joint-fixed/
            out/ci-joint-model/
            out/ci-joint-rejection/
            out/ci-feedback-*/
            out/ci-dependent-splice/
            out/ci-graph-training/
            out/ci-trained-graph-audit/
            out/ci-feature-audit/
            out/ci-origin-feature-audit/
            out/ci-graph-feature-audit/
            out/ci-graph-corpus-audit/
            out/ci-intent-full/feature-audit.json
            out/ci-intent-full/assessment/result.json
            out/ci-intent-ablated/feature-audit.json
            out/ci-intent-ablated/assessment/result.json
            out/ci-retry-policy/
            out/ci-calibrated-report/
            out/ci-search-policy/
            out/ci-search-refinement/
            out/ci-refinement/refinement-dispatch.json
            out/ci-refinement/source-plan.json
            out/ci-refinement/source.gooo
            out/ci-refinement/policy.gooo
            out/ci-refinement/feedback-cases.json
            out/ci-refinement/evaluation-cases.json
            out/ci-refinement/initial-result.json
            out/ci-refinement/refinement-result.json
            out/ci-refinement/final-result.json
            out/ci-refinement/evaluation-result.json
            out/ci-refinement/initial-plan/construction-next-steps.json
            out/ci-refinement/final-plan/construction-next-steps.json
            out/editor-body-generation.json
            out/ci-verification/summary.json
            out/ci-verification/*/result.json
            out/ci-verification/*/replay.json
            out/ci-verification/*/source.gooo
            out/ci-verification/*/cases.json
            out/ci-verification/*/composition/composition.json
            out/ci-verification/*/composition/generated.go
            out/ci-completeness/assessment.json
            out/ci-completeness/receipt.json
            out/ci-completeness/receipt-contract.json
            out/ci-completeness/body-compose-result.json
